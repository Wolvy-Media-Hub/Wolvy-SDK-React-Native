name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Lint, types, tests, package and the example (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      - run: yarn prepare
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - name: Android SDK 36 and NDK 27.1
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"
      - name: Build the example
        working-directory: example/android
        run: ./gradlew --no-daemon assembleRelease -PreactNativeArchitectures=arm64-v8a

  ios:
    name: iOS module and the example (simulator)
    runs-on: macos-latest
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: The Wolvy iOS SDK copy matches CORE_VERSION
        run: |
          commit=$(awk '{print $3}' ios/CORE_VERSION)
          git clone --quiet https://github.com/Wolvy-Media-Hub/Wolvy-SDK-iOS /tmp/core
          git -C /tmp/core checkout --quiet "$commit"
          diff -r /tmp/core/Sources/WolvyPlayer ios/WolvyCore
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: yarn install --immutable
      - name: Pods
        working-directory: example/ios
        run: pod install
      - name: Build the example for the simulator
        working-directory: example/ios
        run: xcodebuild -workspace ReactNativeExample.xcworkspace -scheme ReactNativeExample -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Release CODE_SIGNING_ALLOWED=NO build
